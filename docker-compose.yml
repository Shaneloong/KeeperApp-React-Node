version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: keeper-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - keeper-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keeper-backend
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/KeeperAppDB
      - BACKEND_PORT=5001
      - AI_SERVICE_URL=http://ai-service:8000/api
    depends_on:
      - mongodb
      - ai-service
    networks:
      - keeper-network

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: keeper-ai-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      # Provide HuggingFace API key here or via .env for LLM usage
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    networks:
      - keeper-network
    volumes:
      - ./chroma_db_data:/app/chroma_db

networks:
  keeper-network:
    driver: bridge

volumes:
  mongodb_data:
